name: Prepare and Upload Artifact

on:
  workflow_call:
    secrets:
      projectId:
        required: true
      umbracoCloudApiKey:
        required: true
    outputs:
      artifactId:
        description: 'The Id of the uploaded artifact'
        value: ${{ jobs.prepareDeployment.outputs.artifactId }}

jobs:
  prepareDeployment:
    name: Prepare Artifact to cloud
    # Windows runner so the -r win-x64 publish is built in a matching platform
    # environment. Avoids subtle cross-compile issues (e.g. SqlClient native
    # pairing) seen when publishing Windows-RID assets from Linux.
    runs-on: windows-latest
    outputs:
      artifactId: ${{ steps.upload-artifact.outputs.artifactId }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No secrets are injected into config files here. Everything that used to be
      # written in at build time — the Deploy API key, the Identity client secret,
      # the imaging HMAC key, and the license products — is applied by Umbraco Cloud
      # as environment variables on the target environment instead. The artifact is
      # therefore environment-agnostic and carries no per-environment configuration.

      # Publish framework-dependent for win-x64 (Cloud runs on Windows App
      # Service). Smaller than portable (~72 MB vs ~143 MB) which matters —
      # Cloudflare returned 413 Payload Too Large on the portable attempt.
      # SqlClientFactory.Instance=null seen previously on this output is
      # addressed by pinning Microsoft.Data.SqlClient 7.0 in UmbracoProject.csproj.
      - name: Publish site
        shell: pwsh
        run: |
          dotnet publish src/UmbracoProject/UmbracoProject.csproj `
            --configuration Release `
            --runtime win-x64 `
            --no-self-contained `
            --output "${{ github.workspace }}/publish" `
            /p:UseAppHost=false

      # Enable stdout logging in web.config so any startup crash writes to
      # site/wwwroot/logs/stdout_*.log (visible in Kudu). ANCM only dumps
      # this once at process startup, which is exactly when we crashed.
      - name: Enable stdout logging in web.config
        shell: pwsh
        run: |
          $cfg = "${{ github.workspace }}/publish/web.config"
          [xml]$doc = Get-Content $cfg
          $ancm = $doc.configuration.location.'system.webServer'.aspNetCore
          $ancm.stdoutLogEnabled = "true"
          $doc.Save($cfg)
          Write-Host "--- web.config ---"
          Get-Content $cfg

      # Trim satellite resource assemblies for locales we don't serve — each
      # locale folder ships ~1MB of .resources.dll assemblies. Keeps default (en).
      - name: Trim unused locale satellites
        shell: pwsh
        run: |
          $publish = "${{ github.workspace }}/publish"
          foreach ($d in 'cs','de','es','fr','it','ja','ko','pl','pt-BR','ru','tr','zh-Hans','zh-Hant') {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $publish $d)
          }
          $sizeMB = [math]::Round((Get-ChildItem $publish -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Publish size after trim: $sizeMB MB"

      # Zip the publish output for upload.
      - name: Zip publish output
        shell: pwsh
        run: |
          $zipPath = "${{ github.workspace }}/sources.zip"
          Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath $zipPath -Force
          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "Zipped artifact: $sizeMB MB"

      # store artifact for easy debug if needed
      - name: Store artifact in pipeline
        uses: actions/upload-artifact@v7
        with:
          name: source-artifact
          path: ${{ github.workspace }}/sources.zip
          retention-days: 1

      # Upload your zipped artifact.
      # Paths are relative because ${{ github.workspace }} expands to a Windows
      # path with backslashes, which bash interprets as escape sequences when
      # unquoted in the folded command.
      - name: Post Zipped Artifact
        id: upload-artifact
        shell: bash
        run: |
          bash ./.github/scripts/upload_artifact.sh \
            "${{ secrets.projectId }}" \
            "${{ secrets.umbracoCloudApiKey }}" \
            "./sources.zip" \
            "Artifact for ${{ github.run_number }}" \
            "${{ github.run_number }}" \
            GITHUB \
            "${{ vars.UMBRACO_CLOUD_API_BASE_URL }}"
