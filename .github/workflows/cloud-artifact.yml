name: Prepare and Upload Artifact

on:
  workflow_call:
    secrets:
      projectId:
        required: true
      umbracoCloudApiKey:
        required: true
    outputs:
      artifactId:
        description: 'The Id of the uploaded artifact'
        value: ${{ jobs.prepareDeployment.outputs.artifactId }}

jobs:
  prepareDeployment:
    name: Prepare Artifact to cloud
    # ── Which runner? ───────────────────────────────────────────────────────────
    #
    # Umbraco Cloud runs your site on a Windows App Service, but the artifact does
    # not have to be BUILT on Windows. The publish below is framework-dependent with
    # no runtime identifier, so the output is the same IL and the same runtimes/*
    # native assets whichever OS produces it, and the Web SDK generates web.config on
    # any OS. This template has been verified end to end from ubuntu-latest.
    #
    # ubuntu-latest is the default because it is roughly twice as fast and billed at
    # half the rate of windows-latest for this job.
    #
    # Switch to windows-latest if your build needs Windows. Typical reasons:
    #
    #   * A package or build step that only runs on Windows: an MSBuild task with a
    #     Windows-only dependency, a .NET Framework project in the solution, a
    #     COM-based tool, an installer that ships as .exe/.msi only.
    #   * Front-end or asset tooling that is only set up for Windows, or npm packages
    #     with Windows-only native binaries.
    #   * Windows PowerShell 5.1 scripts (`powershell`, not `pwsh`) or .bat/.cmd files
    #     in your build. pwsh runs on Linux; the other two do not.
    #   * A build that publishes self-contained or with an explicit runtime identifier
    #     (`-r win-x64`, `--self-contained`). Cross-publishing from Linux works for
    #     most projects, but building on Windows removes the doubt.
    #   * Anything you have only ever run on a developer's Windows machine and have
    #     not verified on Linux. Linux file systems are case-sensitive, so a view or
    #     file reference whose casing differs from the file on disk builds on Windows
    #     and fails on Linux. Fix the casing rather than switching runners if you can,
    #     since the App Service itself is case-insensitive and hides the mistake.
    #
    # Nothing else here changes: pwsh, dotnet and the upload action run the same on
    # both. If you use Windows PowerShell 5.1 to zip, note that its Compress-Archive
    # writes backslashes into entry names, which Zip Deploy unpacks incorrectly; use
    # pwsh (PowerShell 7) as this file does.
    runs-on: ubuntu-latest
    outputs:
      artifactId: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # No secrets are injected into config files. The Deploy API key, the Identity
      # client secret, the imaging HMAC key and the license products are all applied
      # by Umbraco Cloud as environment variables on the target environment. The
      # artifact is environment-agnostic and carries no per-environment configuration.
      - name: Publish site
        shell: pwsh
        run: |
          dotnet publish src/UmbracoProject/UmbracoProject.csproj `
            --configuration Release `
            --no-self-contained `
            --output "${{ github.workspace }}/publish" `
            /p:UseAppHost=false

      # Zip the publish output for upload.
      - name: Zip publish output
        shell: pwsh
        run: |
          $zipPath = "${{ github.workspace }}/sources.zip"
          Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath $zipPath -Force
          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "Zipped artifact: $sizeMB MB"

      # store artifact for easy debug if needed
      - name: Store artifact in pipeline
        uses: actions/upload-artifact@v7
        with:
          name: source-artifact
          path: ${{ github.workspace }}/sources.zip
          retention-days: 1

      # Upload the zipped artifact to Umbraco Cloud. The action wraps the v3
      # direct-to-storage flow (upload url -> PUT to blob storage in checksummed
      # blocks -> complete), so the zip never travels through the Cloud API and
      # the 100 MB request limit of the old v2 upload does not apply. The ceiling
      # is 2 GiB. This pipeline only passes parameters; how the upload is done is
      # the action's concern.
      - name: Upload Artifact to Cloud
        id: upload-artifact
        uses: mikkelhm/umbraco-cloud-actions/upload-artifact@v1
        with:
          project-id: ${{ secrets.projectId }}
          api-key: ${{ secrets.umbracoCloudApiKey }}
          path: sources.zip
          description: "Artifact for ${{ github.run_number }}"
          version: ${{ github.run_number }}
          base-url: ${{ vars.UMBRACO_CLOUD_API_BASE_URL || 'https://api.cloud.umbraco.com' }}
