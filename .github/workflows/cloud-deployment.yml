name: Deploy To Cloud

on:
  workflow_dispatch:
    inputs:
      artifactId:
        required: false
        type: string
      targetEnvironmentAlias:
        description: 'The target environment alias to deploy to'
        required: true
        type: string

  workflow_call:
    inputs:
      artifactId:
        required: true
        type: string
      targetEnvironmentAlias:
        description: 'The target environment alias to deploy to'
        required: true
        type: string

    secrets:
      projectId:
        required: true
      umbracoCloudApiKey:
        required: true

jobs:
  deploy:
    name: Deploy to Cloud
    runs-on: ubuntu-latest
    steps:
      # Starts the deployment of the artifact on the target environment and waits for
      # Umbraco Cloud to report it finished. The step fails if the deployment fails.
      # The action wraps the Cloud CI/CD API calls, so this pipeline only passes
      # parameters and is not affected by changes to how the API is called.
      - name: Deploy artifact to Umbraco Cloud
        uses: mikkelhm/umbraco-cloud-actions/deploy@v1
        with:
          project-id: ${{ secrets.projectId }}
          api-key: ${{ secrets.umbracoCloudApiKey }}
          artifact-id: ${{ inputs.artifactId }}
          target-environment-alias: ${{ inputs.targetEnvironmentAlias }}
          commit-message: "Run for ${{ github.run_number }}"
          base-url: ${{ vars.UMBRACO_CLOUD_API_BASE_URL || 'https://api.cloud.umbraco.com' }}
