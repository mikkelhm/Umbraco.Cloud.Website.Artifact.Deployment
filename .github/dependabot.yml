# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Patch and minor updates are merged automatically by
# .github/workflows/dependabot-auto-merge.yml. Major updates always wait for a
# human -- for Umbraco that means a CMS major, which needs the upgrade path
# considered rather than merged.

version: 2
updates:
  # All Umbraco/NuGet package versions live in the root Directory.Packages.props
  # (central package management), so that file is the manifest being updated --
  # the csproj files carry no versions of their own.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"

  # Monthly: the workflows pin floating major tags (actions/checkout@v4 etc), so
  # patch and minor releases are picked up automatically without a PR. The only
  # thing Dependabot can propose here is a major tag bump -- v4 to v5 -- which
  # happens rarely and is excluded from auto-merge anyway.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
